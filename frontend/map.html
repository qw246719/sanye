<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作品地图</title>
    <meta name="theme-color" content="#08080A">
    <meta name="description" content="按省份看作品。点亮的省里有照片。">
    <!-- 刻意和首页共用这一份：地图页要的配色变量、字体、缓动、以及 .lb 那整套
         灯箱样式都在里面，在这里再抄一遍变量是一定会漂的。
         map.css 只写地图页自己的东西，外加三处必要的覆盖。 -->
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>

<!-- 页面上不出现站名，但文档要一个 h1 撑住大纲，只给读屏用 -->
<h1 class="sr-only">作品地图</h1>

<!-- ECharts 画在这上面 -->
<div id="map"></div>

<!-- 地图数据到之前那一下。地图本身是空的、底色也是黑的，页面上要有东西
     说明它正在来，而不是挂了。
     map.js 在 renderMap() / fail() 里给它加 .is-gone 收掉。
     写死在 HTML 里而不是 JS 插进去 —— 脚本要是整个挂掉，至少还留得下一句话 -->
<p class="boot" id="boot" aria-hidden="true"><span class="boot__dot"></span>载入中</p>

<header class="map-bar">
    <p class="map-bar__title">作品地图</p>
    <!-- 右侧收进一个 wrapper：.map-bar 是 space-between，直接往里塞第二个
         链接会被摆到正中间去（首页 .bar__links 是同样的做法） -->
    <nav class="map-bar__links">
        <a class="map-bar__back" href="timeline.html">人生足迹时间轴</a>
        <a class="map-bar__back" href="index.html">← 作品列表</a>
    </nav>
</header>

<!-- 城市搜索条：浮在顶栏下方右上角。输入城市（或省份），回车 / 点按钮
     就放大定位到它所在的省（见 js/map.js 的 searchProvince / locateToProvince）。
     整块是 body 的直接子节点，靠 fixed 定位，不参与顶栏的 space-between -->
<form class="map-search" id="mapSearch" role="search">
    <input class="map-search__input" id="mapSearchInput" type="search"
           placeholder="搜城市 / 省份" autocomplete="off"
           spellcheck="false" aria-label="搜索城市，定位到所在省份">
    <button class="map-search__btn" id="mapSearchBtn" type="submit" aria-label="搜索">搜</button>
</form>

<!-- 一个省都没选的作品全在这儿。数字由 map.js 填 -->
<button class="uncat" id="uncatEntry" type="button">未归类作品 (0)</button>

<!-- ============================================================
     右侧浮着的统计面板「旅途印记」。

     没点省份时它在，点开省份就被详情整个盖住（层级 120 < 详情 160），
     按返回再露出来。数字全部来自 js/map.js 里已有的 byProvince /
     uncategorized，不额外请求接口。

     桌面端是右上角一张浮起来的小卡片（让开顶栏、不拉满整屏），
     窄屏不收成常驻 —— 一块 60vh 一直压在手机上就没法看地图了。
     那里收成右下角一个按钮，点开才从底部滑上来（见 map.css 的媒体查询）。
     ============================================================ -->
<aside class="journey" id="journey" aria-labelledby="journeyTitle">
    <p class="journey__eyebrow">JOURNEY OVERVIEW</p>
    <h2 class="journey__title" id="journeyTitle">旅途印记</h2>

    <!-- 到访城市总数。城市是作品的选填字段，没填的不算 -->
    <p class="journey__big">
        <span class="journey__num" id="journeyCities">0</span>
        <span class="journey__unit">座城市</span>
    </p>
    <p class="journey__note" id="journeyProvinces"></p>

    <div class="journey__meter">
        <div class="journey__meter-head">
            <span>中国省份覆盖率</span>
            <span class="journey__meter-n" id="journeyCoverage">—</span>
        </div>
        <!-- role/aria-valuenow 由 map.js 跟着宽度一起更新 -->
        <div class="journey__bar" id="journeyBar" role="progressbar"
             aria-label="中国省份覆盖率" aria-valuemin="0" aria-valuemax="34" aria-valuenow="0">
            <div class="journey__bar-fill" id="journeyBarFill"></div>
        </div>
    </div>

    <!-- 两张小卡。旅途天数要作品填了拍摄日期才算得出，一条都没有时是「—」 -->
    <div class="journey__cards">
        <div class="journey__card">
            <span class="journey__card-n" id="journeyDays">—</span>
            <span class="journey__card-l">旅途天数</span>
        </div>
        <div class="journey__card">
            <span class="journey__card-n" id="journeyPhotos">0</span>
            <span class="journey__card-l">珍藏照片</span>
        </div>
    </div>

    <h3 class="journey__sec">最近的回忆</h3>
    <div class="journey__list" id="journeyList"></div>
</aside>

<!-- 窄屏才出现：那块面板的开合按钮。桌面上是 display: none -->
<button class="journey-toggle" id="journeyToggle" type="button"
        aria-expanded="false" aria-controls="journey">旅途印记</button>

<!-- ============================================================
     省份详情。点地图上点亮的省就从右侧拉出半屏面板，点「未归类」也走这里
     （那种情况没有省名，标题就是「未归类」，介绍那行不出现）。

     是**覆盖层**不是新页面：地图的缩放/平移状态就这么留在下面，
     返回时还是刚才那张图，不用重画也不用重新拉数据。
     只盖右边（0.6 视口宽）—— 左边的地图还露着，但换省走左上角那个返回按钮。

     没有「关闭」按钮，左上角那个是返回 —— 它同时也是浏览器返回，
     手机上的返回手势能直接关掉（history 那条线见 map.js）。
     ============================================================ -->
<section class="detail" id="detail" role="dialog" aria-modal="true" aria-label="省份作品" hidden>

    <div class="detail__hero" id="detailHero">
        <img class="detail__img" id="detailImg" alt="" decoding="async">
        <div class="detail__veil"></div>

        <button class="detail__back" id="detailBack" type="button" aria-label="返回地图">←</button>
        <span class="detail__pill" id="detailPill"></span>

        <div class="detail__head">
            <p class="detail__date" id="detailDate"></p>
            <h2 class="detail__name" id="detailName"></h2>
            <p class="detail__intro" id="detailIntro"></p>
        </div>
    </div>

    <div class="detail__body">
        <dl class="detail__stats" id="detailStats"></dl>

        <div class="detail__sec">
            <h3>省份影像</h3>
            <span class="detail__updated" id="detailUpdated"></span>
        </div>

        <div class="detail__wall" id="detailWall"></div>
    </div>

</section>

<!-- ============================================================
     灯箱。外观和摆位跟首页那套共用（gallery.css 的 .lb + js/lightbox.js
     的三个摆位函数），但这里只有单张：没有左右箭头、没有从缩略图起飞的动画、
     提示语也只写 ESC。

     必须是 body 的直接子节点：祖先一旦有 filter / backdrop-filter
     就成了包含块，里面的 position: fixed 就不再相对视口定位
     ============================================================ -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="作品大图" hidden>
    <div class="lb__backdrop" id="lbBackdrop"></div>

    <figure class="lb__stage">
        <img class="lb__img" id="lbImg" alt="">
    </figure>

    <figcaption class="lb__cap" id="lbCap">
        <span class="lb__title" id="lbTitle"></span>
        <span class="lb__desc" id="lbDesc"></span>
        <span class="lb__meta"><span id="lbProv"></span></span>
    </figcaption>

    <button class="lb__close" id="lbClose" type="button" aria-label="关闭">✕</button>
    <p class="lb__hint">ESC 关闭</p>
</div>

<script type="module" src="/js/map.js"></script>
</body>
</html>
