    <linearGradient id="bg" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#E6E7EF"/>
      <stop offset="1" stop-color="#A6ACC6"/>
    </linearGradient>
    <radialGradient id="hi" cx=".3" cy=".22" r=".68">
      <stop offset="0" stop-color="#FBFCFF" stop-opacity=".92"/>
